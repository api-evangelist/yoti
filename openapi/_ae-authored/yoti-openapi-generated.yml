components:
  schemas:
    PostAccountsAccountidModerationsRequest:
      type: object
      properties:
        content_id:
          type: string
        moderator_id:
          type: string
        profile_ids:
          type: array
        group_ids:
          type: array
        age_estimation:
          type: integer
        unknown_faces:
          type: boolean
        consent:
          type: boolean
        id_verified_profiles:
          type: boolean
        id_verified_uploader:
          type: boolean
        notifications:
          type: object
        flagged_object_categories:
          type: array
        flagged_contexts:
          type: array
        policies:
          type: array
        user_info:
          type: string
        query:
          type: string
      required:
      - content_id
    PostAccountsAccountidModerationsResponse:
      type: object
      properties:
        id:
          type: string
          description: Created
    PostAiV1V1IdRequest:
      type: object
      properties:
        img:
          type: string
          description: High quality Base64 encoded image. Subject to image requirements https://developers.yoti.com/age-estimation/overview#image-requirements
        img_validation_level:
          type: string
          description: (optional) The level of validations to be applied against the image and bounding boxes to support different sizes of images.
        secure:
          type: object
          description: Required for SICAP Secure image capture) Secure information that certifies the image was not modified. The Yoti React Face
            Capture provides this information that shouldn't be edited.
        age_estimation_model:
          type: string
          description: (optional) Select a specific age estimation model to execute. [Please get in touch with us to discuss switching to a different
            model.]
    PostAiV1V1IdResponse:
      type: object
      properties:
        age:
          type: number
        std_dev:
          type: number
    PostApiV1SessionsRequest:
      type: object
      properties:
        CreateSession:
          type: string
          description: This payload will generate a session configuration object
      required:
      - CreateSession
    PostApiV1SessionsResponse:
      type: object
      properties:
        '200':
          type: string
          description: OK
        '400':
          type: string
          description: Bad request - missing field, spoofing attempt detected, invalid validation methods, need to re-verify
        '401':
          type: string
          description: Missing or unknown Yoti-Sdk-Id
        '403':
          type: string
          description: Not allowed to use this session
    GetApiV1SessionsSessionidResponse:
      type: object
      properties:
        token:
          type: string
        session_id:
          type: string
    PostPoaV1VerifyRequest:
      type: object
      properties:
        qr:
          type: object
          description: Information/Metadata linked to the scanned QR code
        qr.value:
          type: string
          description: The value of the scanned QR code
        qr.scanned_at:
          type: string
          description: When the QR code was scanned by the reader
        terminal:
          type: object
          description: Information/Metadata linked to the terminal that scanned the QR code
        terminal.id:
          type: string
          description: An identifier for the terminal that is used to scan the QR code
        terminal.store_id:
          type: string
          description: An identifier for the location/unit to which the `id` is registered or is operating under
      required:
      - qr
      - qr.value
      - qr.scanned_at
      - terminal
      - terminal.id
    PostPoaV1VerifyResponse:
      type: object
      properties:
        '200':
          type: string
          description: OK
        '202':
          type: string
          description: Accepted
        '400':
          type: string
          description: Bad Request
        '422':
          type: string
          description: Unprocessable Entry
        '500':
          type: string
          description: Server Error
  securitySchemes:
    OAuth2_Client_Credentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.api.yoti.com/v1/oauth/token
          scopes:
            did:match: ''
            poa:verify: ''
      x-source: https://developers.yoti.com/digital-id/did-match-authentication.md
tags:
- name: Accounts
- name: Ai
- name: Api
- name: Oauth
- name: Path
- name: Poa
security:
- OAuth2_Client_Credentials:
  - did:match
  - poa:verify
